<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filter</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="script.js"></script>
  </head>

  <body>
    <section>
      <div id="filter">
        <button class="filter_btn" data-filter="all">All</button>
        <button class="filter_btn" data-filter="electric">Electric</button>
        <button class="filter_btn" data-filter="two">+ 2</button>
        <button class="filter_btn" data-filter="jonas">Electric - Jonas</button>
        <button class="filter_btn" data-filter="ryebread">Rye bread > 1</button>
      </div>
      <div class="grid">
        <table>
          <thead>
            <tr>
              <th>Type</th>
              <th>Fuel</th>
              <th>Passengers</th>
              <th>Stops</th>
              <th>Owned By</th>
              <th>Electric</th>
              <th>Tandem</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </body>
</html>
